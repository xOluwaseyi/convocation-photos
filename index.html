<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convocation Photos | Fagbemi Oluwaseyi David</title>
  <meta name="description" content="Convocation photos of Fagbemi Oluwaseyi David, University of Ilorin, 21st October 2026. View and download the photos.">
  <meta name="theme-color" content="#14213d">
  <meta property="og:title" content="Convocation Photos | Fagbemi Oluwaseyi David">
  <meta property="og:description" content="University of Ilorin, 21st October 2026. Tap to view and download the photos.">
  <meta property="og:image" content="https://convocation.seyifagbemi.me/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://convocation.seyifagbemi.me/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://convocation.seyifagbemi.me/og-image.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213d'/%3E%3Cpath d='M16 7l9 5-9 5-9-5z' fill='%23b08d4a'/%3E%3Cpath d='M10 15v5c0 2 3 4 6 4s6-2 6-4v-5l-6 3z' fill='%23b08d4a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <img class="crest" src="unilorin-logo.png" width="192" height="192" alt="University of Ilorin crest">
    <p class="eyebrow">University of Ilorin</p>
    <h1>Fagbemi Oluwaseyi David</h1>
    <div class="rule" aria-hidden="true"><span></span><i></i><span></span></div>
    <div class="credentials">
      <p class="degree">B. A. (Ed.) English, TRCN</p>
      <p class="date">Wednesday, 21st October, 2026</p>
    </div>
    <p class="hint">Tap <strong>Download</strong> under any photo to save it.</p>
  </header>

  <main>
    <ul id="gallery" class="gallery" aria-label="Photo gallery"></ul>
  </main>

  <footer class="footer">
    <p>Thank you for celebrating with me.</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" aria-label="Previous photo">&#8249;</button>
    <figure>
      <img id="lb-img" alt="">
    </figure>
    <button class="lb-nav lb-next" aria-label="Next photo">&#8250;</button>
    <a id="lb-download" class="btn btn-light" download>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Download</span>
    </a>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
